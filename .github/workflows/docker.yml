name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU lets the amd64 runner build arm64 layers. Registers binfmt_misc
      # handlers so the kernel can transparently exec foreign-arch ELFs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # camoufox fetch pulls a ~200 MB Firefox tarball at build time; caching
      # the entire pip + camoufox layer avoids re-downloading it on every push.
      #
      # Two cache layers:
      #   1. registry cache (type=registry) -- persisted between runs in GHCR as
      #      a separate image tag; survives GHA cache eviction and is available
      #      from any runner (including arm64 self-hosted if added later).
      #   2. GHA layer cache (type=gha) -- faster hit on the same runner because
      #      it's stored locally; additive with the registry cache.
      # After a successful main-branch push, tell the seeder repo to rebuild so
      # its image always pairs with the latest sidecar. The secret is a classic
      # PAT (repo scope) stored as SEEDER_DISPATCH_TOKEN in this repo's secrets.
      - name: Trigger seeder rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SEEDER_DISPATCH_TOKEN }}
          repository: gauravsuman007/plab-seeder
          event-type: sidecar-updated

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=gha
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
            type=gha,mode=max
          # Inline provenance + SBOM; harmless and makes the package page richer.
          provenance: true
          sbom: true
